model_id: "Qwen/Qwen2.5-1.5B-Instruct"
dataset_path: "./data/processed"
output_dir: "./models/lora"
use_qlora: false

# LoRA specific
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: "all-linear"

# Training arguments
learning_rate: 2.0e-4
num_train_epochs: 1
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
logging_steps: 10
bf16: true
